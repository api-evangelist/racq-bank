name: RACQ Bank
kind: company
description: RACQ Bank is the retail banking division of RACQ (The Royal Automobile
  Club of Queensland), a member-owned mutual organisation and one of Queensland's
  largest clubs, long known for roadside assistance, insurance, and banking for its
  members. The bank is an Australian authorised deposit-taking institution (ADI)
  regulated by APRA, offering transaction and savings accounts, term deposits, home
  loans, personal loans, and credit cards. Its banking arm traces to QT Mutual Bank,
  which merged with RACQ in 2016. As an active data holder under Australia's Consumer
  Data Right (CDR / Open Banking), RACQ Bank exposes a public, unauthenticated
  Product Reference Data (PRD) API conforming to the DSB Consumer Data Standards,
  alongside the accredited-data-recipient consumer-data-sharing channels mandated of
  every Australian bank.
