  - url: https://www.racq.com.au/banking/open-banking/api-access
    type: Documentation
  - url: https://consumerdatastandardsaustralia.github.io/standards/#banking-apis
    type: APIReference
  - url: openapi/racq-bank-cds-banking-products-openapi.yml
    type: OpenAPI
  description: Public, unauthenticated Consumer Data Right Product Reference Data
    (PRD) API exposing RACQ Bank's publicly available banking products (transaction
    and savings accounts, term deposits, home and personal loans, credit cards) via
    the standard CDS endpoints GET /banking/products and GET
    /banking/products/{productId}. Confirmed live (HTTP 200, x-v 4 and x-v 5, 39
    products) at https://cdrbank.racq.com.au/cds-au/v1.
- aid: racq-bank:racq-bank-cdr-accounts-balances-api
  name: RACQ Bank CDR Accounts & Balances API
  tags:
  - CDR
  - Open Banking
  - Accounts
  - Balances
  - Banking
  - Australia
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://www.racq.com.au/banking/open-banking
  baseURL: https://cdrbank.racq.com.au/cds-au/v1/banking/accounts
  properties:
  - url: https://www.racq.com.au/banking/open-banking
    type: Documentation
  - url: https://consumerdatastandardsaustralia.github.io/standards/#banking-apis
    type: APIReference
  - url: openapi/racq-bank-cds-banking-products-openapi.yml
    type: OpenAPI
  description: Consumer-authorized Consumer Data Right accounts and balances channel
    that RACQ Bank implements as a mandated CDR data holder. Covers the standardized
    DSB Consumer Data Standards endpoints GET /banking/accounts (list accounts), GET
    /banking/accounts/balances (bulk balances), GET /banking/accounts/{accountId}/balance
    (single balance) and GET /banking/accounts/{accountId} (account detail). Unlike
    the public Product Reference Data API, these endpoints return a customer's own
    data and require the CDR consent + accredited-data-recipient (ADR) authorization
    flow over MTLS; unauthenticated probes return HTTP 403. Endpoints and schemas are
    defined by the shared DSB CDR Banking API standard (v1.36.0), not proprietary to
    RACQ Bank. Base host confirmed at https://cdrbank.racq.com.au/cds-au/v1.
- aid: racq-bank:racq-bank-cdr-transactions-api
  name: RACQ Bank CDR Transactions API
  tags:
  - CDR
  - Open Banking
  - Transactions
  - Banking
  - Australia
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://www.racq.com.au/banking/open-banking
  baseURL: https://cdrbank.racq.com.au/cds-au/v1/banking/accounts
  properties:
  - url: https://www.racq.com.au/banking/open-banking
    type: Documentation
  - url: https://consumerdatastandardsaustralia.github.io/standards/#banking-apis
    type: APIReference
  - url: openapi/racq-bank-cds-banking-products-openapi.yml
    type: OpenAPI
  description: Consumer-authorized Consumer Data Right transactions channel exposing
    a customer's account transaction history through the standardized DSB Consumer
    Data Standards endpoints GET /banking/accounts/{accountId}/transactions (list
    transactions with filtering) and GET
    /banking/accounts/{accountId}/transactions/{transactionId} (transaction detail).
    As with all consumer data-sharing endpoints, access requires the CDR consent and
    accredited-data-recipient (ADR) authorization flow over MTLS rather than being
    publicly reachable. The paths and payload schemas come from the shared DSB CDR
    Banking API standard (v1.36.0) that every Australian ADI is required to implement,
    not from a bank-proprietary specification. Base host confirmed at
    https://cdrbank.racq.com.au/cds-au/v1.
- aid: racq-bank:racq-bank-cdr-direct-debits-scheduled-payments-api
  name: RACQ Bank CDR Direct Debits & Scheduled Payments API
  tags:
  - CDR
  - Open Banking
  - Direct Debits
  - Scheduled Payments
  - Banking
  - Australia
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://www.racq.com.au/banking/open-banking
  baseURL: https://cdrbank.racq.com.au/cds-au/v1/banking/accounts
  properties:
  - url: https://www.racq.com.au/banking/open-banking
    type: Documentation
  - url: https://consumerdatastandardsaustralia.github.io/standards/#banking-apis
    type: APIReference
  - url: openapi/racq-bank-cds-banking-products-openapi.yml
    type: OpenAPI
  description: Consumer-authorized Consumer Data Right channel for a customer's direct
    debit authorizations and scheduled/recurring payments, implemented by RACQ Bank
    per the DSB Consumer Data Standards. Covers GET
    /banking/accounts/{accountId}/direct-debits and GET /banking/accounts/direct-debits
    (bulk) for direct debits, plus GET /banking/accounts/{accountId}/payments/scheduled
    and GET /banking/payments/scheduled (bulk) for scheduled payments. These endpoints
    return customer-specific arrangements and require the CDR consent +
    accredited-data-recipient (ADR) authorization flow over MTLS. Endpoint paths and
    schemas are defined by the shared DSB CDR Banking API standard (v1.36.0), a
    surface every Australian ADI must implement, not proprietary to RACQ Bank. Base
    host confirmed at https://cdrbank.racq.com.au/cds-au/v1.
- aid: racq-bank:racq-bank-cdr-payees-api
  name: RACQ Bank CDR Payees API
  tags:
  - CDR
  - Open Banking
  - Payees
  - Banking
  - Australia
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://www.racq.com.au/banking/open-banking
  baseURL: https://cdrbank.racq.com.au/cds-au/v1/banking/payees
  properties:
  - url: https://www.racq.com.au/banking/open-banking
    type: Documentation
  - url: https://consumerdatastandardsaustralia.github.io/standards/#banking-apis
    type: APIReference
  - url: openapi/racq-bank-cds-banking-products-openapi.yml
    type: OpenAPI
  description: Consumer-authorized Consumer Data Right payees channel exposing a
    customer's saved payees through the standardized DSB Consumer Data Standards
    endpoints GET /banking/payees (list saved payees) and GET /banking/payees/{payeeId}
    (payee detail, including domestic, biller and international payee schemes). Access
    requires the CDR consent and accredited-data-recipient (ADR) authorization flow
    over MTLS rather than being publicly reachable. The endpoint paths and payload
    schemas are defined by the shared DSB CDR Banking API standard (v1.36.0) that
    every Australian ADI is required to implement, not by a bank-proprietary
    specification. Base host confirmed at https://cdrbank.racq.com.au/cds-au/v1.
