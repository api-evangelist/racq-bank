  notes: >-
    RACQ Bank operates two distinct access channels under Australia's Consumer
    Data Right (CDR). The Product Reference Data (PRD) endpoints are PUBLIC and
    require NO authentication. The consumer data-sharing endpoints (accounts,
    balances, transactions, direct debits, scheduled payments, payees) are only
    reachable by an accredited data recipient (ADR) under the CDR security
    profile and are not usable with a client-issued credential.
